<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TCC Department Head</title><style>*{box-sizing:border-box}body{margin:0;background:#080808;color:#eee;font:14px system-ui}.wrap{max-width:1000px;margin:auto;padding:25px}.panel{background:#111;border:1px solid #302815;border-radius:10px;padding:18px;margin-top:16px}.gold{background:#d9b65d;color:#080808;font-weight:800;border:0}.btn{padding:10px 14px;border-radius:7px;cursor:pointer}.field{display:grid;gap:6px}.field input{padding:11px;background:#080808;color:#fff;border:1px solid #333;border-radius:6px}.form{display:grid;gap:12px}.notice{padding:12px;background:#15120a;border:1px solid #40371f;border-radius:7px;color:#d9c991}table{width:100%;border-collapse:collapse}td,th{padding:11px;border-bottom:1px solid #292929;text-align:left}th{font-size:10px;color:#888;text-transform:uppercase}</style></head><body><div class="wrap"><h1 style="color:#d9b65d">Department Head Portal</h1><p>Grant community access only to members of your assigned department.</p><div id="gate" class="notice">Checking access…</div><main id="app" style="display:none"><div class="panel"><button id="signout" class="btn">Sign out</button><h2>Invite / Grant Community Access</h2><form id="grant" class="form"><div class="field"><label>Email</label><input name="email" type="email" required></div><div class="field"><label>Full name</label><input name="full_name" required></div><div class="field"><label>Username</label><input name="username"></div><button class="btn gold">Grant Access & Invite</button><span id="msg"></span></form></div><div class="panel"><h2>My Department Members</h2><div id="list"></div></div></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(async()=>{const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));let c;async function init(){const x=await fetch('/api/system?type=config').then(r=>r.json());c=supabase.createClient(x.url,x.anonKey);const s=await c.auth.getSession();if(!s.data.session){$('#gate').textContent='Sign in with your department-head account.';return}const r=await api('me');if(r.role?.role!=='department_head'){if(r.role?.role==='admin'){location.href='/admin/';return}$('#gate').textContent='This account is not assigned as a department head.';return}$('#gate').textContent='Signed in as department head · department access is enforced server-side.';$('#app').style.display='block';load()}async function token(){return (await c.auth.getSession()).data.session?.access_token||''}async function api(a,m='GET',b){const o={method:m,headers:{Authorization:'Bearer '+await token()}};if(b){o.headers['Content-Type']='application/json';o.body=JSON.stringify(b)}const r=await fetch('/api/community?action='+a,o),d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}async function load(){try{const d=await api('manage-members');$('#list').innerHTML=d.items?.length?'<table><tr><th>Name</th><th>Department</th><th>Status</th><th></th></tr>'+d.items.map(x=>'<tr><td>'+esc(x.member_profiles?.full_name||'')+'</td><td>'+esc(x.departments?.name||'')+'</td><td>'+esc(x.status)+'</td><td><button class="btn" data-id="'+x.user_id+'" data-status="'+(x.status==='active'?'suspended':'active')+'">'+(x.status==='active'?'Suspend':'Activate')+'</button></td></tr>').join('')+'</table>':'<div class="notice">No members in your department yet.</div>';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=async()=>{await api('manage-members','POST',{action:'status',user_id:b.dataset.id,status:b.dataset.status});load()})}catch(e){$('#list').innerHTML='<div class="notice">'+esc(e.message)+'</div>'}}$('#grant').onsubmit=async e=>{e.preventDefault();try{await api('manage-members','POST',{action:'grant',...Object.fromEntries(new FormData(e.target))});$('#msg').textContent='Access granted / invitation sent.';e.target.reset();load()}catch(x){$('#msg').textContent=x.message}};$('#signout').onclick=async()=>{await c.auth.signOut();location.reload()};init()})()</script></body></html>
